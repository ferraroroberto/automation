# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "working-pipe"
icon        = "🤖"
description = "Python automation grab-bag."
shape       = "pipeline-cli"
# One folder per tool domain; docs/layout.md says what each holds. Tests live under
# tests/<domain>/, never beside the code.
extra_roots = ["audio", "excel", "git-housekeeping", "google", "html", "image", "linkedin", "notion", "parking", "smart_life", "system", "text", "video"]

# [vendored] -- components copied byte-for-byte from project-scaffolding, with the
# scaffold commit each came from. Re-vendor through /propagate-vendored, never by hand.
[vendored]
structure_ratchet = { src = "scripts/structure_ratchet.py", sha = "84d2b12ab416551762e4a615e4a706df91cea69f", dest = "scripts/structure_ratchet.py" }
instruction_ratchet = { src = "scripts/instruction_ratchet.py", sha = "60fdd0350f18d28838428b2e773f7868f6381fbf", dest = "scripts/instruction_ratchet.py" }
doc_refs_ratchet = { src = "scripts/doc_refs_ratchet.py", sha = "23dbefa46635c952d3c871bda4e80b740e7f2859", dest = "scripts/doc_refs_ratchet.py" }

# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/structure_ratchet.py, which fails when
# a new file passes 1,000 lines, a new function 100 lines or a flat directory 40
# modules, when a baselined offender grows past its size in
# .structure-ratchet-baseline.json, and when the root folders do not match `shape`
# plus `extra_roots`. Existing offenders are baselined at today's size, never
# excluded. Exit 3 (git unusable, an unparseable file, an unknown shape) fails the
# gate. Procedure: project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet stage over the
# instruction files (CLAUDE.md, AGENTS.md; this repo keeps no skills or rules files).
# The gate runs scripts/instruction_ratchet.py, which fails when a violation-cap hit
# count rises above .instruction-ratchet-baseline.json or CLAUDE.md passes its size cap.
# Existing hits are baselined, never excluded. Exit 3 (git unusable, unreadable file)
# fails the gate as NOT CONFIRMED. Procedure: project-scaffolding docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet stage over documentation
# references. The gate runs scripts/doc_refs_ratchet.py, which fails when README.md,
# CLAUDE.md or docs/**/*.md names a repo path, `python -m` module or relative link
# that does not exist and is not recorded in .doc-refs-ratchet-baseline.json. No port
# is declared here, so ports are not checked. Exit 3 (git unusable, a non-UTF-8 file, an
# unclosed fence) fails the gate as NOT CONFIRMED. Procedure: project-scaffolding
# docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled  = true
baseline = ".doc-refs-ratchet-baseline.json"
