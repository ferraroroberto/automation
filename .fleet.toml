# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "working-pipe"
icon        = "🤖"
description = "Python automation grab-bag."
shape       = "pipeline-cli"
# One folder per tool domain; docs/layout.md says what each holds. Tests live under
# tests/<domain>/, never beside the code.
extra_roots = ["audio", "excel", "git-housekeeping", "google", "html", "image", "linkedin", "notion", "parking", "smart_life", "system", "text", "video"]

# [vendored] -- components copied byte-for-byte from project-scaffolding, with the
# scaffold commit each came from. Re-vendor through /propagate-vendored, never by hand.
[vendored]
structure_ratchet = { src = "scripts/structure_ratchet.py", sha = "84d2b12ab416551762e4a615e4a706df91cea69f", dest = "scripts/structure_ratchet.py" }
instruction_ratchet = { src = "scripts/instruction_ratchet.py", sha = "60fdd0350f18d28838428b2e773f7868f6381fbf", dest = "scripts/instruction_ratchet.py" }
doc_refs_ratchet = { src = "scripts/doc_refs_ratchet.py", sha = "23dbefa46635c952d3c871bda4e80b740e7f2859", dest = "scripts/doc_refs_ratchet.py" }
dead_code_ratchet = { src = "scripts/dead_code_ratchet.py", sha = "8cc9a5f908c48dabc69971ff958869dffed1ba21", dest = "scripts/dead_code_ratchet.py" }
static_ratchet = { src = "scripts/static_ratchet.py", sha = "537cf3931b57e7453ed251850c0dbeac042b03bf", dest = "scripts/static_ratchet.py" }
docs_ratchet = { src = "scripts/docs_ratchet.py", sha = "fdb750461997c4a13eacea8091f115ff12bba564", dest = "scripts/docs_ratchet.py" }
comment_ratchet = { src = "scripts/comment_ratchet.py", sha = "e56308e1c099712cf5a006557c94e3f9ae4fe8aa", dest = "scripts/comment_ratchet.py" }
conventions_ratchet = { src = "scripts/conventions_ratchet.py", sha = "0eb0da42298e391fc614b3fe550bd6cf2d07c693", dest = "scripts/conventions_ratchet.py" }

# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/structure_ratchet.py, which fails when
# a new file passes 1,000 lines, a new function 100 lines or a flat directory 40
# modules, when a baselined offender grows past its size in
# .structure-ratchet-baseline.json, and when the root folders do not match `shape`
# plus `extra_roots`. Existing offenders are baselined at today's size, never
# excluded. Exit 3 (git unusable, an unparseable file, an unknown shape) fails the
# gate. Procedure: project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet stage over the
# instruction files (CLAUDE.md, AGENTS.md; this repo keeps no skills or rules files).
# The gate runs scripts/instruction_ratchet.py, which fails when a violation-cap hit
# count rises above .instruction-ratchet-baseline.json or CLAUDE.md passes its size cap.
# Existing hits are baselined, never excluded. Exit 3 (git unusable, unreadable file)
# fails the gate as NOT CONFIRMED. Procedure: project-scaffolding docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet stage over documentation
# references. The gate runs scripts/doc_refs_ratchet.py, which fails when README.md,
# CLAUDE.md or docs/**/*.md names a repo path, `python -m` module or relative link
# that does not exist and is not recorded in .doc-refs-ratchet-baseline.json. No port
# is declared here, so ports are not checked. Exit 3 (git unusable, a non-UTF-8 file, an
# unclosed fence) fails the gate as NOT CONFIRMED. Procedure: project-scaffolding
# docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled  = true
baseline = ".doc-refs-ratchet-baseline.json"

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet stage over unreferenced
# Python definitions. The gate runs scripts/dead_code_ratchet.py, which fails when a new
# function, class or method has no reference anywhere in the tracked tree and is not
# recorded in .dead-code-ratchet-baseline.json. Exit 3 (git unusable, a file that does
# not parse) fails the gate as NOT CONFIRMED. Procedure: project-scaffolding
# docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"

# [static_ratchet] -- the scaffold's baseline-and-ratchet stage over duplicated blocks
# (jscpd, via npx), unused imports and variables, and a curated set of ruff bug and
# security codes. The gate runs scripts/static_ratchet.py, which fails when a finding is
# not recorded in .static-ratchet-baseline.json. Existing findings are baselined, never
# excluded; vendored scripts are left out automatically. Exit 3 (no npx, ruff missing,
# a detector that did not run) fails the gate as NOT CONFIRMED. Procedure:
# project-scaffolding docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"

# [docs_ratchet] -- the scaffold's baseline-and-ratchet stage over README.md and docs/**/*.md:
# the root README's size in bytes and the history markers (issue references, dated and
# changelog headings) per file. The gate runs scripts/docs_ratchet.py, which fails when either
# rises above .docs-ratchet-baseline.json. Existing debt is baselined, never excluded. Exit 3
# (git unusable, a non-UTF-8 file, an unclosed fence or comment) fails the gate as NOT
# CONFIRMED. Procedure: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [comment_ratchet] -- the scaffold's baseline-and-ratchet stage over issue references
# (#NNN) in product-code comments (.py, .js, .css, .ps1), counted per file. The gate runs
# scripts/comment_ratchet.py, which fails when a file's count rises above
# .comment-ratchet-baseline.json. Tests and vendored scripts are left out automatically.
# Existing references are baselined, never excluded. Exit 3 (git unusable, a file that
# could not be scanned) fails the gate as NOT CONFIRMED. Procedure: project-scaffolding
# docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"

# [conventions_ratchet] -- the scaffold's baseline-and-ratchet stage over fleet conventions
# held as stdlib `ast` rules, counted per file and rule. The gate runs
# scripts/conventions_ratchet.py, which fails when a file's count for an enabled rule rises
# above .conventions-ratchet-baseline.json. Vendored scripts are left out automatically.
# Rules enabled here: no-window (a Windows repo that spawns external tools; no_window.py is
# the shared flag) and no-drive-path (no hardcoded drive paths). logging-not-print is off
# (no app/ or src/ folder; these are CLI-style scripts that print by design), secret-compare
# and git-wrapper are off (the repo has no such helper). A call that must break a rule keeps
# a reasoned `# <rule>-exempt: why` marker. Exit 3 (git unusable, a tracked .py file that
# does not parse) fails the gate as NOT CONFIRMED. Procedure:
# project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled  = true
baseline = ".conventions-ratchet-baseline.json"
rules    = ["no-window", "no-drive-path"]
