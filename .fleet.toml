# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "working-pipe"
icon        = "🤖"
description = "Python automation grab-bag."
shape       = "pipeline-cli"
depends_on  = ["fleet-config"]
# One folder per tool domain; docs/layout.md says what each holds. Tests live under
# tests/<domain>/, never beside the code.
extra_roots = ["audio", "excel", "google", "html", "image", "linkedin", "notion", "parking", "smart_life", "system", "text", "video"]

# [vendored] -- components copied byte-for-byte from project-scaffolding, with the
# scaffold commit each came from. Re-vendor through /propagate-vendored, never by hand.
[vendored]
structure_ratchet = { src = "scripts/structure_ratchet.py", sha = "4a06ca84fc9c5005d4be7fa505c9d0e7c0472dba", dest = "scripts/structure_ratchet.py" }
structure_layout = { src = "scripts/structure_layout.py", sha = "1563f834338bcb5d6612dfbc2bdf2953b973fba2", dest = "scripts/structure_layout.py" }
structure_band = { src = "scripts/structure_band.py", sha = "3b708fd3c54ab7b93b08d489406c405762c83c41", dest = "scripts/structure_band.py" }
box_lock_gate = { src = "scripts/box_lock_gate.ps1", sha = "de5b351ecbc58f0908bc1cbdcdf76fd41f36005d", dest = "scripts/box_lock_gate.ps1" }
instruction_ratchet = { src = "scripts/instruction_ratchet.py", sha = "fe8cc1bdbd038ed65947186248df13072eceb25a", dest = "scripts/instruction_ratchet.py" }
doc_refs_ratchet = { src = "scripts/doc_refs_ratchet.py", sha = "4a06ca84fc9c5005d4be7fa505c9d0e7c0472dba", dest = "scripts/doc_refs_ratchet.py" }
dead_code_ratchet = { src = "scripts/dead_code_ratchet.py", sha = "4a06ca84fc9c5005d4be7fa505c9d0e7c0472dba", dest = "scripts/dead_code_ratchet.py" }
static_ratchet = { src = "scripts/static_ratchet.py", sha = "fe8cc1bdbd038ed65947186248df13072eceb25a", dest = "scripts/static_ratchet.py" }
docs_ratchet = { src = "scripts/docs_ratchet.py", sha = "9e6be351ac1e711c9c82fb8987e2405b0a1c28fe", dest = "scripts/docs_ratchet.py" }
comment_ratchet = { src = "scripts/comment_ratchet.py", sha = "1ed07ddb5002d4513adf0ce45f1bfaf68f3acc32", dest = "scripts/comment_ratchet.py" }
conventions_ratchet = { src = "scripts/conventions_ratchet.py", sha = "ab06ad732591d4edab00774ee93a455189c14577", dest = "scripts/conventions_ratchet.py" }
conventions_readers = { src = "scripts/conventions_readers.py", sha = "ab06ad732591d4edab00774ee93a455189c14577", dest = "scripts/conventions_readers.py" }
conventions_state = { src = "scripts/conventions_state.py", sha = "fe8cc1bdbd038ed65947186248df13072eceb25a", dest = "scripts/conventions_state.py" }
runtime_write_ratchet = { src = "scripts/runtime_write_ratchet.py", sha = "4a06ca84fc9c5005d4be7fa505c9d0e7c0472dba", dest = "scripts/runtime_write_ratchet.py" }
runtime_write_resolve = { src = "scripts/runtime_write_resolve.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/runtime_write_resolve.py" }
instruction_frontmatter = { src = "scripts/instruction_frontmatter.py", sha = "e55de9619b9625c5499e1b9077350f9860e6037b", dest = "scripts/instruction_frontmatter.py" }
instruction_repeats = { src = "scripts/instruction_repeats.py", sha = "e55de9619b9625c5499e1b9077350f9860e6037b", dest = "scripts/instruction_repeats.py" }
pooled_http = { src = "src/pooled_http.py", sha = "ae8a450dcb10a62c4e18b4f10fccddeabe6d8404", dest = "system/_lib/pooled_http.py" }

# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/structure_ratchet.py, which fails when
# a new file passes 1,000 lines, a new function 100 lines or a flat directory 40
# modules, when a baselined offender grows past its size in
# .structure-ratchet-baseline.json, and when the root folders do not match `shape`
# plus `extra_roots`. Existing offenders are baselined at today's size, never
# excluded. Exit 3 (git unusable, an unparseable file, an unknown shape) fails the
# gate. Procedure: project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet stage over the
# instruction files (CLAUDE.md, AGENTS.md; this repo keeps no skills or rules files).
# The gate runs scripts/instruction_ratchet.py, which fails when a violation-cap hit
# count rises above .instruction-ratchet-baseline.json or CLAUDE.md passes its size cap.
# Existing hits are baselined, never excluded. Exit 3 (git unusable, unreadable file)
# fails the gate as NOT CONFIRMED. Procedure: project-scaffolding docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"
ci_expectations = true
agents_pointer = true
repeated_text_words = 12

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet stage over documentation
# references. The gate runs scripts/doc_refs_ratchet.py, which fails when README.md,
# CLAUDE.md or docs/**/*.md names a repo path, `python -m` module or relative link
# that does not exist and is not recorded in .doc-refs-ratchet-baseline.json. No port
# is declared here, so ports are not checked. Exit 3 (git unusable, a non-UTF-8 file, an
# unclosed fence) fails the gate as NOT CONFIRMED. Procedure: project-scaffolding
# docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled  = true
baseline = ".doc-refs-ratchet-baseline.json"

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet stage over unreferenced
# Python definitions. The gate runs scripts/dead_code_ratchet.py, which fails when a new
# function, class or method has no reference anywhere in the tracked tree and is not
# recorded in .dead-code-ratchet-baseline.json. Exit 3 (git unusable, a file that does
# not parse) fails the gate as NOT CONFIRMED. Procedure: project-scaffolding
# docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"

# [static_ratchet] -- the scaffold's baseline-and-ratchet stage over duplicated blocks
# (jscpd, via npx), unused imports and variables, and a curated set of ruff bug and
# security codes. The gate runs scripts/static_ratchet.py, which fails when a finding is
# not recorded in .static-ratchet-baseline.json. Existing findings are baselined, never
# excluded; vendored scripts are left out automatically. Exit 3 (no npx, ruff missing,
# a detector that did not run) fails the gate as NOT CONFIRMED. Procedure:
# project-scaffolding docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"

# [docs_ratchet] -- the scaffold's baseline-and-ratchet stage over Markdown docs:
# the root README's size in bytes and the history markers (issue references, dated and
# changelog headings) per file. The gate runs scripts/docs_ratchet.py, which fails when either
# rises above .docs-ratchet-baseline.json. `include` widens the vendored default
# (`README.md`, `docs/`) to every tool-domain folder in `extra_roots`, since a per-tool
# README carries the same present-tense rule the vendored default only checked at the
# root. Existing debt is baselined, never excluded. Exit 3 (git unusable, a non-UTF-8
# file, an unclosed fence or comment) fails the gate as NOT CONFIRMED. Procedure:
# project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"
include  = ["README.md", "docs/", "audio/", "excel/", "google/", "html/", "image/", "linkedin/", "notion/", "parking/", "smart_life/", "system/", "text/", "video/"]

# [comment_ratchet] -- the scaffold's baseline-and-ratchet stage over issue references
# (#NNN) in product-code comments (.py, .js, .css, .ps1), counted per file. The gate runs
# scripts/comment_ratchet.py, which fails when a file's count rises above
# .comment-ratchet-baseline.json. Tests and vendored scripts are left out automatically.
# Existing references are baselined, never excluded. Exit 3 (git unusable, a file that
# could not be scanned) fails the gate as NOT CONFIRMED. Procedure: project-scaffolding
# docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"
docstrings = true
history_phrases = true

# [conventions_ratchet] -- the scaffold's baseline-and-ratchet stage over fleet conventions
# held as stdlib `ast` rules, counted per file and rule. The gate runs
# scripts/conventions_ratchet.py, which fails when a file's count for an enabled rule rises
# above .conventions-ratchet-baseline.json. Vendored scripts are left out automatically.
# Rules enabled here: no-window (a Windows repo that spawns external tools; no_window.py is
# the shared flag) and no-drive-path (no hardcoded drive paths). logging-not-print is off
# (no app/ or src/ folder; these are CLI-style scripts that print by design), secret-compare
# and git-wrapper are off (the repo has no such helper). A call that must break a rule keeps
# a reasoned `# <rule>-exempt: why` marker. Exit 3 (git unusable, a tracked .py file that
# does not parse) fails the gate as NOT CONFIRMED. Procedure:
# project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled  = true
baseline = ".conventions-ratchet-baseline.json"
rules    = ["no-window", "no-drive-path", "subprocess-timeout", "state-literal", "state-set-repeat", "state-write"]

# A bare requests.<verb> opens a fresh connection per call; every outbound call goes through
# pooled_http.pooled_request (one keep-alive session, one retry for idempotent methods). The
# repo has no src/, so the vendored helper sits in system/_lib/, the shared-helper package. A call that
# must stay bare keeps a reasoned `# must-use-exempt: why` marker.
[[conventions_ratchet.must_use]]
call   = ["requests.get", "requests.post", "requests.put", "requests.patch", "requests.delete", "requests.head", "requests.request"]
helper = ["system/_lib/pooled_http.py"]
why    = "outbound HTTP goes through the pooled session in system/_lib/pooled_http.py"

# [runtime_write_ratchet] -- scripts/runtime_write_ratchet.py fails when a tracked
# Python file gains a write target (open for writing, Path.write_*, mkdir, a log
# FileHandler, sqlite3.connect, a copy destination) whose path resolves under a code
# folder, beyond .runtime-write-ratchet-baseline.json; a new target it cannot resolve
# is "not confirmed" (exit 3), never clean. The same script brackets the test stages
# (--snapshot before, --probe after) and fails on any untracked or ignored file the
# run left under a code folder. Mechanism: project-scaffolding docs/runtime-write-ratchet.md.
[runtime_write_ratchet]
enabled  = true
baseline = ".runtime-write-ratchet-baseline.json"
# The tool folders are this repo's code (the extra_roots above), alongside scripts/.
code_folders = ["scripts", "audio", "excel", "google", "html", "image", "linkedin",
                "notion", "parking", "smart_life", "system", "text", "video"]

# [[state_machines]] -- the lifecycles this repo declares in one module each, so the
# conventions ratchet's state rules stop reporting that module and keep reporting any
# other module that re-spells them. Why and who reads them: docs/parking-outcome-state.md and system/mouse_mover.md.
[[state_machines]]
name   = "parking-day"
module = "parking/booking.py"
type   = "DayStatus"

[[state_machines]]
name   = "parking-run"
module = "parking/booking.py"
type   = "RunStatus"
derive = "derive_run_status"

[[state_machines]]
name   = "mouse-mover"
module = "system/mouse_mover.py"
type   = "MoverState"
