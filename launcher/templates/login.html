<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f1115">
    <title>Launcher · Login</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            background: #0f1115;
            color: #e7e9ee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #161922;
            border: 1px solid #232838;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 20px;
            margin: 0 0 16px;
            font-weight: 600;
        }
        label {
            display: block;
            font-size: 13px;
            color: #8b93a7;
            margin-bottom: 6px;
        }
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            color: #e7e9ee;
            background: #0f1115;
            border: 1px solid #2a2f42;
            border-radius: 10px;
            outline: none;
        }
        input[type="password"]:focus {
            border-color: #5b8cff;
        }
        button {
            width: 100%;
            margin-top: 16px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: #3b6cff;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            min-height: 56px;
        }
        button:active { background: #2f57d4; }
        .flash {
            margin-bottom: 16px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
        }
        .flash.error { background: #3a1d22; color: #ffb4b4; border: 1px solid #5a2630; }
        .flash.success { background: #18331f; color: #b6f0c4; border: 1px solid #235a32; }
    </style>
</head>
<body>
    <form class="card" method="post" action="{{ url_for('login_post') }}">
        <h1>Project Launcher</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit">Sign in</button>
    </form>
</body>
</html>
